name = "homepage"
account_id = "8132f8d4a7abd8f167ca128689b18df0"
main = "worker/index.ts"
compatibility_date = "2026-11-25"
workers_dev = true
preview_urls = false

[[routes]]
pattern = "zxabinbina.cc.cd/*"
zone_id = "b6876b19d9026b21b06f57ae0213f2c0"

[assets]
directory = "dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/office-viewer/v0.2.0/wasm/prebuilt/x2t.wasm.br"]
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"

[vars]
SITE_ORIGIN = "https://zxabinbina.cc.cd"
TURNSTILE_SITE_KEY = "0x4AAAAAAFLJE6GmOhrQYCZC"

[[kv_namespaces]]
binding = "GAME_EXPERIENCE"
id = "9ae7880e164547739323803eda2b1939"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "GameRoom"

[[durable_objects.bindings]]
name = "ROOM_DIRECTORY"
class_name = "RoomDirectory"

[[migrations]]
tag = "v1-game-rooms"
new_sqlite_classes = ["GameRoom", "RoomDirectory"]

[[ratelimits]]
name = "ROOM_LIMIT"
namespace_id = "1003"
simple = { limit = 30, period = 60 }

[observability]
enabled = false
