<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="theme-color" content="#141521" />
    <meta name="description" itemprop="description" content="<%= site.description %>" />
    <meta property="og:title" content="<%= site.title %>" />
    <meta property="og:description" content="<%= site.description %>" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%= site.name %>" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="<%= site.url %>" />
    <meta property="og:image" content="<%= site.image %>" />
    <meta property="og:image:secure_url" content="<%= site.image %>" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="<%= site.imageAlt %>" />
    <meta itemprop="name" content="<%= site.title %>" />
    <meta itemprop="image" content="<%= site.image %>" />
    <link rel="canonical" href="<%= site.url %>" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" />
    <title><%= site.title %></title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
