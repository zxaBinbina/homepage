<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="theme-color" content="#141521" />
    <style>
      :root {
        background: var(--bg, #141521);
        color-scheme: dark;
      }
      :root[data-theme='light'] {
        background: var(--bg, #f4f6fa);
        color-scheme: light;
      }
      :root[data-palette='hutao-red'] {
        background: #3a1b19;
        color-scheme: dark;
      }
      :root[data-theme='light'][data-palette='hutao-red'] {
        background: #fcf0e1;
        color-scheme: light;
      }
    </style>
    <style>
      <%- loadingStyles %>
    </style>
    <script>
      // Set the theme before styles load to avoid a flash of the wrong color.
      let savedTheme
      let savedPalette
      try {
        savedTheme = localStorage.getItem('homepage-theme')
        savedPalette = localStorage.getItem('homepage-palette')
      } catch {
        /* Fall back to the browser preference when storage is unavailable. */
      }
      const initialTheme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
      document.documentElement.dataset.theme = initialTheme
      const initialPalette = savedPalette === 'hutao-red' ? 'hutao-red' : 'fufu-blue'
      document.documentElement.dataset.palette = initialPalette
      document.querySelector('meta[name="theme-color"]').content =
        initialPalette === 'hutao-red'
          ? initialTheme === 'light'
            ? '#fcf0e1'
            : '#3a1b19'
          : initialTheme === 'light'
            ? '#f4f6fa'
            : '#141521'
    </script>
    <meta name="description" itemprop="description" content="<%= site.description %>" />
    <meta name="robots" content="<%= site.robots %>" />
    <script id="site-structured-data" type="application/ld+json">
      <%- structuredData %>
    </script>
    <meta property="og:title" content="<%= site.title %>" />
    <meta property="og:description" content="<%= site.description %>" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%= site.name %>" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="<%= site.url %>" />
    <meta property="og:image" content="<%= site.image %>" />
    <meta property="og:image:secure_url" content="<%= site.image %>" />
    <meta property="og:image:type" content="<%= site.imageType %>" />
    <meta property="og:image:width" content="<%= site.imageWidth %>" />
    <meta property="og:image:height" content="<%= site.imageHeight %>" />
    <meta property="og:image:alt" content="<%= site.imageAlt %>" />
    <meta itemprop="name" content="<%= site.title %>" />
    <meta itemprop="image" content="<%= site.image %>" />
    <link rel="canonical" href="<%= site.url %>" />
    <link
      rel="icon"
      href="/<%= ['rdp', 'wiki', 'downloads'].includes(page) ? 'images/rdp-access-auth.png' : 'favicon.svg' %>"
      type="<%= ['rdp', 'wiki', 'downloads'].includes(page) ? 'image/png' : 'image/svg+xml' %>"
    />
    <title><%= site.title %></title>
  </head>
  <body id="top" class="<%= ['rdp', 'wiki', 'downloads'].includes(page) ? 'rdp-site' : '' %>">
    <div id="site-loading" data-mode="initial" data-state="waiting" hidden inert aria-hidden="true">
      <div class="site-loading-card">
        <div class="site-loading-content">
          <div class="site-loading-mark" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
          <div class="site-loading-copy" aria-live="polite" aria-atomic="true">
            <p class="site-loading-label">a彬彬a · 在代码与方块之间</p>
            <p class="site-loading-title">正在搭建这一页</p>
            <p class="site-loading-description">一点点准备，马上见面。</p>
          </div>
          <div class="site-loading-track" aria-hidden="true"><span></span></div>
        </div>
        <a class="site-loading-retry" href="" inert aria-hidden="true">重新加载</a>
      </div>
    </div>
    <noscript><p class="site-loading-noscript">请启用 JavaScript 后重新加载页面。</p></noscript>
    <script>
      <%- loadingScript %>
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
