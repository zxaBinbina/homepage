<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Content-Security-Policy" content="upgrade-insecure-requests" />
    <meta name="theme-color" content="#141521" />
    <script>
      // Set the theme before styles load to avoid a flash of the wrong color.
      let savedTheme
      try {
        savedTheme = localStorage.getItem('homepage-theme')
      } catch {
        /* Fall back to the browser preference when storage is unavailable. */
      }
      const initialTheme =
        savedTheme === 'light' || savedTheme === 'dark'
          ? savedTheme
          : matchMedia('(prefers-color-scheme: light)').matches
            ? 'light'
            : 'dark'
      document.documentElement.dataset.theme = initialTheme
      document.querySelector('meta[name="theme-color"]').content =
        initialTheme === 'light' ? '#f4f6fa' : '#141521'
    </script>
    <meta name="description" itemprop="description" content="<%= site.description %>" />
    <meta property="og:title" content="<%= site.title %>" />
    <meta property="og:description" content="<%= site.description %>" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="<%= site.name %>" />
    <meta property="og:locale" content="zh_CN" />
    <meta property="og:url" content="<%= site.url %>" />
    <meta property="og:image" content="<%= site.image %>" />
    <meta property="og:image:secure_url" content="<%= site.image %>" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="<%= site.imageAlt %>" />
    <meta itemprop="name" content="<%= site.title %>" />
    <meta itemprop="image" content="<%= site.image %>" />
    <link rel="canonical" href="<%= site.url %>" />
    <link
      rel="icon"
      href="/<%= page === 'home' ? 'favicon.svg' : 'images/rdp-access-auth.png' %>"
      type="<%= page === 'home' ? 'image/svg+xml' : 'image/png' %>"
    />
    <title><%= site.title %></title>
  </head>
  <body id="top" class="<%= page === 'home' ? '' : 'rdp-site' %>">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
